<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMaxYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9922b"/>
      <stop offset=".55" stop-color="#a8651f"/>
      <stop offset="1" stop-color="#5b3a1a"/>
    </linearGradient>
    <!-- Colonne (dessin original) -->
    <g id="col">
      <rect x="-22" y="-8" width="44" height="14" rx="3" fill="#f6e7c1"/>
      <rect x="-15" y="6" width="30" height="120" fill="#f6e7c1"/>
      <path d="M-9 6v120M0 6v120M9 6v120" stroke="#b98a3e" stroke-opacity=".5" stroke-width="2"/>
      <rect x="-22" y="126" width="44" height="14" rx="3" fill="#f6e7c1"/>
    </g>
  </defs>
  <rect width="800" height="400" fill="url(#g)"/>
  <!-- Soleil -->
  <circle cx="640" cy="120" r="70" fill="#ffe29a" fill-opacity=".55"/>
  <circle cx="640" cy="120" r="44" fill="#ffe9b3" fill-opacity=".8"/>
  <!-- Pyramides -->
  <path d="M430 330 L540 190 L650 330z" fill="#f0cf86" fill-opacity=".85"/>
  <path d="M540 190 L650 330 L575 330z" fill="#b98a3e" fill-opacity=".55"/>
  <path d="M600 330 L690 220 L780 330z" fill="#f0cf86" fill-opacity=".7"/>
  <!-- Sol et colonnes -->
  <rect y="330" width="800" height="70" fill="#4a2f14" fill-opacity=".55"/>
  <g opacity=".9">
    <use href="#col" x="470" y="250" transform="translate(0 -20)"/>
    <use href="#col" x="740" y="240" transform="translate(0 -14)"/>
  </g>
</svg>
