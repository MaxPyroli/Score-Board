      <stop offset="0" stop-color="#0b5d8a"/>
      <stop offset=".25" stop-color="#2a8f9e"/>
      <stop offset=".5" stop-color="#4fb46a"/>
      <stop offset=".72" stop-color="#e8c23a"/>
      <stop offset=".88" stop-color="#ee7a2e"/>
