name: Android

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  # L'APK de test est construit seul pour être disponible au plus vite.
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # ANDROID_HOME est défini sur les runners GitHub : le module :app est donc inclus.
      - name: APK de test
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: panagames-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # Vérifications en parallèle de la construction de l'APK.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (cœur et moteurs de règles)
        run: ./gradlew :core:test :tarot-engine:test :skyjo-engine:test :freecounter-engine:test :session:test

      - name: Vérifie que le bundle de publication se construit (non signé)
        run: ./gradlew :app:bundleRelease
