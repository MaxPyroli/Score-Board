name: Web

on:
  push:
    branches: [main, "claude/**"]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]

# Deux versions du site (même GitHub Pages, branche gh-pages) :
#  - publique : à la racine, mise à jour seulement à la fusion sur main ;
#  - bêta : dans /beta/, mise à jour à chaque envoi sur une branche claude/** (pour tester avant de publier).
concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_CHANNEL: ${{ github.ref == 'refs/heads/main' && 'public' || 'beta' }}
      VITE_PUBLIC_URL: https://maxpyroli.github.io/Score-Board/
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: score-board-web
          path: web/dist

  # Publication sur GitHub Pages (branche gh-pages). Les deux versions coexistent : keep_files garde l'autre intacte.
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Une seule publication à la fois, pour que la version publique et la bêta ne s'écrasent pas.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    env:
      OVH_FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: score-board-web
          path: dist
      - name: Publier la version publique (racine)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          keep_files: true
      - name: Publier la bêta (dossier beta)
        if: github.ref != 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          destination_dir: beta
          keep_files: true
      # Bêta aussi sur l'hébergement OVH (adresse à part, installable séparément) : seulement si les secrets existent.
      # Secrets du dépôt : OVH_FTP_HOST, OVH_FTP_USER, OVH_FTP_PASSWORD, et OVH_FTP_DIR (dossier du site, ex. app/).
      # Envoi par SFTP (port 22) : le FTPS de l'hébergement OVH n'est pas accepté.
      - name: Publier la bêta sur OVH (SFTP)
        if: github.ref != 'refs/heads/main' && env.OVH_FTP_HOST != ''
        continue-on-error: true
        env:
          OVH_FTP_USER: ${{ secrets.OVH_FTP_USER }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_DIR: ${{ secrets.OVH_FTP_DIR }}
        run: |
          # Le dossier est vidé puis remplacé : on refuse les dossiers « larges » par sécurité.
          case "$OVH_FTP_DIR" in ""|"."|"./"|"/"|"www"|"www/"|"~"|"~/") echo "OVH_FTP_DIR invalide : $OVH_FTP_DIR"; exit 1;; esac
          sudo apt-get install -y -qq lftp > /dev/null
          lftp -u "$OVH_FTP_USER","$OVH_FTP_PASSWORD" "sftp://$OVH_FTP_HOST:22" -e "set sftp:auto-confirm yes; set net:max-retries 2; mirror -R --delete --verbose=1 dist/ $OVH_FTP_DIR; bye"
