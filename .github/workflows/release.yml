name: Publication (AAB pour Google Play)

# À lancer à la main (onglet Actions → « Publication » → Run workflow).
# Nécessite 4 secrets du dépôt : UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD,
# UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD (voir docs/play-store/README.md).
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé d'envoi
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "Secret UPLOAD_KEYSTORE_BASE64 manquant : voir docs/play-store/README.md" >&2
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Tests (cœur et moteurs de règles)
        run: ./gradlew :core:test :tarot-engine:test :skyjo-engine:test :freecounter-engine:test :session:test

      - name: Bundle signé
        env:
          UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: panagames-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
